name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Verify mirrored content is current
        run: |
          npm run sync-content
          git diff --exit-code -- docs spec
          if [ -n "$(git ls-files --others --exclude-standard -- docs spec)" ]; then
            echo "Mirrored content includes new uncommitted files:"
            git ls-files --others --exclude-standard -- docs spec
            exit 1
          fi

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test theme preferences
        run: npm test

      - name: Test rendered link verification
        run: python3 tests/test_built_links.py

      - name: Build production site
        run: npx next build

      - name: Verify rendered documentation routes and fragments
        run: python3 scripts/verify-built-links.py
